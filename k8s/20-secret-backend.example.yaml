# ★★이것은 템플릿입니다. 실제 값을 여기 적지 마십시오 — git 에 올라갑니다.
#
# 실제 Secret 은 명령으로 만듭니다(값이 파일에 안 남습니다):
#
#   kubectl -n catchap create secret generic catchap-backend-secret \
#     --from-literal=DATABASE_URL='mysql+pymysql://catchap_backend:<비번>@az-a.mysql-team1.…:3306/catchap_dev_db?charset=utf8mb4' \
#     --from-literal=JWT_SECRET_KEY='…' \
#     --from-literal=SMTP_APP_PASSWORD='…' \
#     --from-literal=STT_WORKER_TOKEN='…' \
#     --from-literal=METRICS_INGEST_TOKEN='…' \
#     --from-literal=PORTONE_CHANNEL_KEY='…' \
#     --from-literal=PORTONE_API_SECRET='…' \
#     --from-literal=MEDIA_S3_ACCESS_KEY='…' \
#     --from-literal=MEDIA_S3_SECRET_KEY='…'
#
# ★DATABASE_URL 은 새 관리형 MySQL 주소로 바꿔야 합니다(옛 주소 10.0.1.168 아님).
# ★STT_WORKER_TOKEN 은 새 GPU 워커의 토큰입니다 — 옛 값과 다릅니다(회전 대상).
# ★MEDIA_S3_* 는 catchap-backend 계정의 S3 액세스 키입니다(IAM 키 아님).
#
# 나중에 Secrets Manager 에서 읽도록 바꾸면 이 Secret 은 부트스트랩 키 1개로 줄어듭니다.
apiVersion: v1
kind: Secret
metadata:
  name: catchap-backend-secret
  namespace: catchap
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME"
  SMTP_APP_PASSWORD: "REPLACE_ME"
  STT_WORKER_TOKEN: "REPLACE_ME"
  METRICS_INGEST_TOKEN: "REPLACE_ME"
  PORTONE_CHANNEL_KEY: "REPLACE_ME"
  PORTONE_API_SECRET: "REPLACE_ME"
  MEDIA_S3_ACCESS_KEY: "REPLACE_ME"
  MEDIA_S3_SECRET_KEY: "REPLACE_ME"
