apiVersion: apps/v1
kind: Deployment
metadata:
  name: catchap-backend
  namespace: catchap
spec:
  # ★파드 2개 — 이게 K8s 로 옮기는 이유다. 하나가 죽어도 서비스가 이어진다.
  #   미디어를 Object Storage 로 뺐기 때문에 2개가 가능해졌다(로컬 디스크였으면 깨진다).
  #   ⚠️로그인 세션은 아직 프로세스 메모리에 있다 → 세션을 Valkey 로 옮기기 전까지
  #     파드가 바뀌면 재로그인이 필요할 수 있다. 그래서 세션 무상태화가 다음 작업이다.
  replicas: 2
  selector:
    matchLabels: { app: catchap-backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # 무중단 — 새 파드가 뜬 뒤 옛 것을 뺀다
  template:
    metadata:
      labels: { app: catchap-backend }
    spec:
      imagePullSecrets: [{ name: cr-pull }]             # 사설 레지스트리 — 없으면 ImagePullBackOff
      # 두 워커에 흩어뜨린다 — 한 노드가 빠져도 서비스가 이어진다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: catchap-backend }
      containers:
        - name: api
          image: kc-sfacspace05.kr-central-2.kcr.dev/catchap-backend-repo/backend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: catchap-backend-config }
            - secretRef:    { name: catchap-backend-secret }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          # 기동이 끝났는지 — 통과 전에는 Service 가 트래픽을 안 보낸다
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          # 살아 있는지 — 죽으면 컨테이너를 다시 띄운다. readiness 보다 느슨하게 잡는다
          # (일시적 부하로 재시작 폭풍이 나지 않게).
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
