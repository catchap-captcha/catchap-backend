# 인그레스 — 호스트명으로 갈라 보낸다. 지금 Caddy 가 하는 일을 대신한다.
#
# ★TLS 는 여기서 하지 않는다. 로드밸런서(210.109.55.233)가 우리 SAN 인증서로 TLS 를 끝내고
#   워커에는 평문 HTTP:80 으로 보낸다. 그래서 tls: 절이 없다.
#   (카카오 문서: ALB 리스너가 HTTPS 면 대상 그룹 프로토콜은 HTTP 만 가능)
#
# ★인그레스 컨트롤러는 hostNetwork: true 로 워커1에 고정해 배포한다 —
#   ① 이 클러스터는 Admission Webhook 미지원이라 hostNetwork 가 필요하고
#   ② LB 가 단일 AZ(kr-central-2-a)라 워커1(10.0.2.128)만 대상이 될 수 있다.
#   앱 파드는 두 워커에 흩어지므로 파드·워커2 장애는 견딘다. 입구만 하나다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catchap
  namespace: catchap
  annotations:
    # 업로드 상한 — 강의 영상이 최대 5GB. 기본값(1MB)이면 업로드가 413 으로 막힌다.
    nginx.ingress.kubernetes.io/proxy-body-size: "5g"
    # 영상 스트리밍·STT 전사는 오래 걸린다. 기본 60초면 끊긴다.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # 응답을 버퍼링하면 영상이 메모리에 쌓인다 — 스트리밍은 그대로 흘려보낸다.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    # apex — 지금 Caddy 가 www 로 301 리다이렉트한다. 그 동작을 유지한다(아래 별도 리소스).
    - host: catchap5.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catchap-frontend
                port: { number: 80 }
    - host: www.catchap5.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catchap-frontend
                port: { number: 80 }
    - host: api.catchap5.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catchap-backend
                port: { number: 8000 }
---
# apex → www 리다이렉트 (지금 Caddy 가 하는 것)
# ★빠뜨리면 catchap5.com 으로 들어온 사람이 www 로 안 넘어간다. 지금 실제로 301 이 나간다.
#   위 규칙과 호스트가 겹치므로 리다이렉트 전용 인그레스를 따로 둔다(어노테이션이 리소스 단위라서).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catchap-apex-redirect
  namespace: catchap
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: "https://www.catchap5.com$request_uri"
spec:
  ingressClassName: nginx
  rules:
    - host: catchap5.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catchap-frontend
                port: { number: 80 }
