apiVersion: apps/v1
kind: Deployment
metadata:
  name: catchap-frontend
  namespace: catchap
spec:
  replicas: 2
  selector:
    matchLabels: { app: catchap-frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: catchap-frontend }
    spec:
      imagePullSecrets: [{ name: cr-pull }]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: catchap-frontend }
      containers:
        - name: web
          # ★프론트는 VITE_* 가 빌드 타임에 번들에 박힌다. API 주소가 바뀌면 재빌드해야 한다
          #   (ConfigMap 으로 런타임에 못 바꾼다). nginx 정적 서빙이라 설정이 따로 없다.
          image: kc-sfacspace05.kr-central-2.kcr.dev/catchap-front-repo/frontend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 80, name: http }]
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 20
