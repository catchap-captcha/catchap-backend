apiVersion: apps/v1
kind: Deployment
metadata:
  name: catchap-ai
  namespace: catchap
spec:
  # 1개로 시작 — 내부 전용이고 shadow 모드(판정만 기록)라 가용성 요구가 낮다.
  # 모델 파일을 이미지에 담아 메모리를 많이 쓰므로 요청도 넉넉히 잡는다.
  replicas: 1
  selector:
    matchLabels: { app: catchap-ai }
  template:
    metadata:
      labels: { app: catchap-ai }
    spec:
      imagePullSecrets: [{ name: cr-pull }]
      containers:
        - name: ai
          image: kc-sfacspace05.kr-central-2.kcr.dev/catchap-batch-repo/ai:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8010, name: http }]
          envFrom:
            - configMapRef: { name: catchap-ai-config }
            - secretRef:    { name: catchap-ai-secret }
          resources:
            requests: { cpu: "200m", memory: "1Gi" }
            limits:   { cpu: "1",    memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8010 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8010 }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
