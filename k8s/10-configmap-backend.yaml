# 백엔드 평문 설정 — 비밀이 아닌 것만. 비밀은 Secret 으로 따로 넣는다.
# ★값은 프로덕션 컨테이너 환경변수를 그대로 옮긴 뒤, 새 VPC 주소로 바꾼 것이다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catchap-backend-config
  namespace: catchap
data:
  ENV: "production"
  TZ: "Asia/Seoul"                       # 앱이 naive datetime 을 쓰므로 KST 고정 필수
  FRONTEND_URL: "https://www.catchap5.com"
  BACKEND_URL: "https://api.catchap5.com"
  CORS_ORIGINS: "https://www.catchap5.com,https://catchap5.com"
  TRUST_PROXY_HEADER: "true"             # LB·인그레스를 거치므로 X-Forwarded-* 를 신뢰

  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "14"

  MAIL_FROM: "catchap5@catchap5.com"
  MAIL_FROM_NAME: "CatChap"
  MAIL_REPLY_TO: "no-reply@catchap5.com"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "09.daviya.09@daviya.kr"

  DRAG_CAPTCHA_ENABLED: "true"
  BOT_ESCALATION_MODE: "record"           # record = 관측만. enforce 는 임계값 교정 후
  BOT_SUSPICION_THRESHOLD: "10"
  CATCHAP_UNLOCK_ALL_CHAPTERS: "1"

  PORTONE_STORE_ID: "store-af63494b-0374-429b-a9c2-8e6aa3be949c"   # 공개값(브라우저 SDK 용)

  # ★새 GPU 서버. 옛 주소는 10.0.1.52 였다.
  STT_WORKER_URL: "http://10.0.5.57:8100"

  # ★미디어를 Object Storage 로 — K8s 에서 파드를 늘리면 로컬 디스크가 파드마다 달라
  #   업로드한 영상을 다른 파드가 못 찾는다(요청이 어디로 가느냐에 따라 404).
  #   문제가 생기면 이 값만 local 로 되돌리면 된다(이미지 재빌드 불필요).
  MEDIA_STORAGE_BACKEND: "object"
  MEDIA_BUCKET: "catchap-storage-prod-team1"
  MEDIA_KEY_PREFIX: "media"
  MEDIA_S3_ENDPOINT: "https://objectstorage.kr-central-2.kakaocloud.com"
  MEDIA_S3_REGION: "kr-central-2"
