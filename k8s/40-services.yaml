# Service — 파드들에 고정된 이름·주소를 준다.
# 파드는 죽었다 살아나면 IP 가 바뀌지만 Service 이름은 그대로다. 인그레스는 이 이름으로 보낸다.
# ★Service 는 노드를 넘어 분배한다 — 인그레스가 워커1에만 있어도 워커2의 파드로 간다.
apiVersion: v1
kind: Service
metadata:
  name: catchap-backend
  namespace: catchap
spec:
  type: ClusterIP        # 클러스터 안에서만. 외부 노출은 인그레스가 맡는다
  selector: { app: catchap-backend }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: catchap-frontend
  namespace: catchap
spec:
  type: ClusterIP
  selector: { app: catchap-frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: catchap-ai
  namespace: catchap
spec:
  # 내부 전용 — 백엔드만 부른다. 인그레스에 노출하지 않는다.
  type: ClusterIP
  selector: { app: catchap-ai }
  ports:
    - name: http
      port: 8010
      targetPort: 8010
