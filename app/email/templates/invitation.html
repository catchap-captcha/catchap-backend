<!doctype html>
<html lang="ko">
  <body style="margin:0;padding:0;background:#FFF6EC;font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;">

      <div style="background:#fff;border:2px solid #FFEDE4;border-radius:28px;padding:36px 30px;text-align:center;box-shadow:0 22px 46px -28px rgba(180,120,90,0.5);">
        <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#FFE6BE,#FFCFC9);display:inline-block;line-height:72px;font-size:36px;">💌</div>

        </p>

      </div>
      <p style="text-align:center;font-size:11.5px;color:#B0A79B;margin-top:18px;">CatChap 캣챱 · 어린이 교육용 CAPTCHA 학습 서비스</p>
