<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- 사이트 라이트 팔레트 고정. 메일 클라이언트가 색을 자동 반전하면 잉크/경계선 톤이 무너진다. -->
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>비밀번호 재설정 코드</title>
    <style>
      /* send_email()이 본문 맨 끝에 덧붙이는 '발신 전용' 안내를 카드 폭(480px)에 맞춰 정렬한다.
         본문은 전부 table 이라 이 선택자(body 직계 hr/p)에는 걸리지 않는다.
         인라인 스타일을 이기려면 !important 가 필요하다.
         주의: 이 파일 어디에도 body 닫는 태그 문자열을 다시 쓰면 안 된다 —
         _finalize_html()이 '첫 번째' 매치 앞에 안내문을 끼워 넣어 엉뚱한 곳에 들어간다. */
      body > hr {
        max-width: 480px;
        margin: 28px auto 0 !important;
        border: 0 !important;
        border-top: 1px solid #ebebeb !important;
      }
      body > p {
        max-width: 480px;
        margin: 14px auto 44px !important;
        padding: 0 4px;
        font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, -apple-system, 'Segoe UI', sans-serif !important;
        font-size: 12px !important;
        line-height: 1.7 !important;
        color: #8e8e93 !important;
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#fafafa;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fafafa;">
      <tr>
        <td align="center" style="padding:44px 20px 0;">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;">
            <!-- 카드 — surface #fff / line #ebebeb / r-lg 20px / shadow-md -->
            <tr>
              <td style="background:#ffffff;border:1px solid #ebebeb;border-radius:20px;padding:36px 32px;box-shadow:0 1px 2px rgba(20,20,20,0.05),0 14px 30px -26px rgba(20,20,20,0.16);">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding:0 0 6px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:24px;font-weight:800;letter-spacing:-0.03em;color:#1a1a1a;">
                      비밀번호 재설정 코드
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:0 0 22px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;font-weight:500;line-height:1.6;color:#5c5e62;">
                      비밀번호 재설정을 위해 아래 인증 코드를 입력해 주세요.
                    </td>
                  </tr>
                  <!-- 코드 — 재설정 화면의 코드 입력칸(bg #fafafa / line-strong #dadada / r 12px)과 같은 모양.
                       letter-spacing 이 마지막 글자 뒤에도 붙어 가운데정렬이 왼쪽으로 밀리므로
                       그만큼 padding-left 를 더 준다(30px = 20px + 10px). -->
                  <tr>
                    <td align="center" style="background:#fafafa;border:1px solid #dadada;border-radius:12px;padding:18px 20px 18px 30px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:30px;font-weight:700;letter-spacing:10px;color:#1a1a1a;">
                      {{ code }}
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:18px 0 0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:12.5px;font-weight:500;line-height:1.65;color:#8e8e93;">
                      이 코드는 5분 동안만 유효해요. 요청하지 않았다면 비밀번호는 바뀌지 않으니 안심하세요.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:18px 2px 0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;font-weight:500;color:#8e8e93;">
                CatChap 캣챱 · 시청을 검증하는 강의 학습
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
