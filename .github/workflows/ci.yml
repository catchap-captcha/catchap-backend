name: CI

# 배포 전 회귀 게이트 — push/PR마다 전체 테스트 실행. 테스트는 SQLite in-memory(conftest)라
# 외부 DB가 필요 없다. ⚠️브랜치 보호는 ★Free 플랜이라 강제되지 않는다 — 빨간불이어도 병합이 막히지 않으니
# 사람이 보고 판단해야 한다.
# ★언제 도는가 — ★PR 과 main 뿐이다 (2026-08-11 변경).
#   그전에는 `branches: ['**']` 이라 ★모든 브랜치의 모든 푸시에서 돌았고,
#   PR 작업 중에는 커밋 하나가 ★두 번 검사됐다 — PR 화면에
#   `CI / test (push)` 와 `CI / test (pull_request)` 가 나란히 떴다.
#   Free 플랜 + 비공개 저장소라 Actions 분(分)이 ★유료 계량 대상이다.
#
# ⚠️main 을 남기는 이유 — 브랜치 보호를 못 걸어(Free 플랜) ★main 직접 push 가
#   막히지 않는다. 그때도 검사는 돌아야 한다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 병렬로 2~3분이지만, 러너가 느린 날을 위한 여유
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
        # -n auto : 코어 수만큼 프로세스를 나눠 돌린다.
        #   conftest 의 SQLite 는 in-memory 라 프로세스마다 따로 생긴다 - 서로 안 밟는다.
        #
        # 재 본 것과 안 재 본 것을 구분해서 적는다.
        #   [재 본 것] 0807 로컬 32코어: 28분 05초 -> 1분 56초 (14.5배)
        #   [재 본 것] 0807 CI(이 변경 전) 백엔드: 약 7분
        #   [안 재 본 것] CI 러너에서 몇 배가 되는지. 러너는 코어가 적어
        #                로컬만큼은 안 나온다. 이 커밋이 들어간 뒤 다음 CI 시간을
        #                위 7분과 비교하면 그때 답이 나온다.
        #   ! 처음엔 "CI 도 2~3배" 라고 적었다가 지웠다. 재 보지 않은 숫자였다.
        #
        # 왜 하나 - 빠른 것 자체보다 "장애 창에 덜 노출되는 것" 이 크다.
        #   0807 에 GitHub 러너 배정이 고장나 큐에서 15분 기다리다 잘렸다.
        #   짧게 끝날수록 그런 창을 덜 맞는다.
        run: pytest -q -n auto
