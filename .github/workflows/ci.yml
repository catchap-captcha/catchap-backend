name: CI

# 배포 전 회귀 게이트 — push/PR마다 전체 테스트 실행. 테스트는 SQLite in-memory(conftest)라
# 외부 DB가 필요 없다. 통과해야 머지하도록 브랜치 보호에 이 체크를 필수로 건다.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
        run: pytest -q
