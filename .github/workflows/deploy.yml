name: 이미지 만들고 배포 태그 갱신

# ★「main 병합 = 자동 배포」의 마지막 조각입니다.
#
#   main 에 병합  →  ★이 워크플로가 이미지를 만들어 Container Registry 에 올리고
#                 →  catchap-infra 의 매니페스트에서 ★이미지 태그를 그 커밋 해시로 고칩니다
#                 →  ArgoCD 가 그걸 보고 클러스터에 반영합니다
#
# ★태그는 반드시 ★커밋 해시입니다. latest 를 쓰면 무엇이 떠 있는지 알 수 없어집니다.
#
# ⬜필요한 Secret 3개 (저장소 Settings → Secrets and variables → Actions)
#     REGISTRY_USERNAME        Container Registry 용 ★IAM 액세스 키 ID
#     REGISTRY_PASSWORD        〃 보안 액세스 키
#     INFRA_DEPLOY_KEY   catchap-infra 에 ★쓰기 권한이 있는 Deploy key 의 ★비밀키
#                        (ArgoCD 가 쓰는 읽기 전용 키와 ★다른 키입니다)

on:
  push:
    branches: [main]
  workflow_dispatch:      # 손으로도 돌릴 수 있게

permissions:
  contents: read

concurrency:
  # 같은 저장소에서 연달아 병합되면 ★뒤엣것만 남깁니다 (태그가 엎치락뒤치락하지 않게)
  group: deploy-backend
  cancel-in-progress: false

env:
  REGISTRY: kc-sfacspace05.kr-central-2.kcr.dev
  IMAGE_PATH: catchap-backend-repo/catchap-backend          # 예) catchap-backend-repo/catchap-backend
  # ★파일 하나가 아니라 ★디렉터리입니다 — 이미지 줄이 ★두 곳에 있습니다.
  #   30-deployment.yaml (앱)  ·  20-migrate-job.yaml (마이그레이션 Job)
  #   ★태그가 어긋나면 「옛 코드의 마이그레이션」을 돌리게 됩니다.
  MANIFEST_DIR: k8s/backend

jobs:
  build-and-update:
    name: 이미지 → 레지스트리 → 매니페스트 태그
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 코드 받기
        uses: actions/checkout@v5

      - name: 태그 정하기 (커밋 해시 7자리)
        id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: 필요한 Secret 이 다 있나 먼저 본다
        id: gate
        env:
          U: ${{ secrets.REGISTRY_USERNAME }}
          P: ${{ secrets.REGISTRY_PASSWORD }}
          K: ${{ secrets.INFRA_DEPLOY_KEY }}
        run: |
          # ★값은 찍지 않고 있는지만 봅니다
          MISS=""
          [ -z "$U" ] && MISS="$MISS REGISTRY_USERNAME"
          [ -z "$P" ] && MISS="$MISS REGISTRY_PASSWORD"
          [ -z "$K" ] && MISS="$MISS INFRA_DEPLOY_KEY"
          if [ -n "$MISS" ]; then
            # ★실패가 아니라 ★건너뜁니다 — 아직 Secret 을 안 넣은 동안 main 이 빨개지지 않게.
            #   넣으면 그때부터 저절로 돕니다.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret 이 아직 없습니다 →$MISS · 이미지 빌드를 건너뜁니다."
            {
              echo "### ⬜아직 준비 중입니다"
              echo ""
              echo "다음 Secret 을 넣으면 이 워크플로가 저절로 돕니다."
              echo ""
              echo '```'
              echo "$MISS"
              echo '```'
              echo ""
              echo "저장소 Settings → Secrets and variables → Actions"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Secret 3개 확인"

      - name: Buildx 준비
        if: steps.gate.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 레지스트리 로그인
        if: steps.gate.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 이미지 만들고 올리기
        if: steps.gate.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}:${{ steps.tag.outputs.sha }}
          # ★latest 는 일부러 안 붙입니다 — 무엇이 떠 있는지 알 수 없어집니다
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: catchap-infra 받기 (쓰기 키로)
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.INFRA_DEPLOY_KEY }}" > ~/.ssh/infra
          chmod 600 ~/.ssh/infra
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/infra -o IdentitiesOnly=yes" \
            git clone --quiet git@github.com:catchap-captcha/catchap-infra.git infra
          test -d infra/.git || { echo "::error::catchap-infra 를 못 받았습니다"; exit 1; }

      - name: 매니페스트 태그 갱신
        if: steps.gate.outputs.ready == 'true'
        id: bump
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          cd infra
          test -d "$MANIFEST_DIR" || { echo "::error::$MANIFEST_DIR 가 없습니다"; exit 1; }
          # ★디렉터리 안의 ★모든 이미지 줄을 바꿉니다.
          #   앱(Deployment)과 마이그레이션(Job)이 ★같은 태그여야 하기 때문입니다.
          #   ★한 파일만 고치면 「옛 코드의 마이그레이션」을 돌리게 됩니다.
          python3 - "$MANIFEST_DIR" "$REGISTRY/$IMAGE_PATH" "$SHA" <<'PY'
          import io, os, re, sys
          d, path, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          pat = re.compile(r'(image:\s*)' + re.escape(path) + r':(\S+)')
          before, after, touched = set(), set(), []
          for name in sorted(os.listdir(d)):
              if not name.endswith(('.yaml', '.yml')) or '예시' in name:
                  continue
              f = os.path.join(d, name)
              t = io.open(f, encoding='utf-8').read()
              found = pat.findall(t)
              if not found:
                  continue
              before.update(tag for _, tag in found)
              t2 = pat.sub(lambda m: m.group(1) + path + ':' + sha, t)
              io.open(f, 'w', encoding='utf-8', newline='\n').write(t2)
              after.add(sha)
              touched.append('%s(%d)' % (name, len(found)))
          if not touched:
              print('::error::%s 안에서 %s 이미지 줄을 하나도 못 찾았습니다' % (d, path))
              sys.exit(1)
          print('  고친 곳: %s' % ', '.join(touched))
          print('  전: %s' % ' '.join(sorted(before)))
          print('  후: %s' % ' '.join(sorted(after)))
          # ★고치기 ★전에 파일들이 어긋나 있었는지 본다.
          #   어긋남 = 앞선 배포가 일부만 바꿨다는 뜻이다. 지금 갱신이 하나로
          #   모았으므로 막지는 않되, 그 사실을 남긴다.
          #   2026-08-11: 여기 원래 고친 ★뒤(after)를 봤는데 ★죽은 검사였다.
          #      우리가 전부 sha 로 덮어쓰므로 뒤는 ★항상 한 종류다.
          if len(before) > 1:
              print('::warning::고치기 전 태그가 %d 종류였다 (%s) — 지금 %s 로 모았다'
                    % (len(before), ', '.join(sorted(before)), sha))
          # ★바뀐 게 없으면 커밋하지 않는다
          io.open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8').write(
              'changed=%s\n' % ('false' if before == after else 'true'))
          PY
      - name: catchap-infra 에 올리기
        if: steps.gate.outputs.ready == 'true' && steps.bump.outputs.changed == 'true'
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          cd infra
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST_DIR"
          git commit -q -m "ci(deploy): backend 이미지를 ${SHA} 로" \
                        -m "${GITHUB_REPOSITORY}@${GITHUB_SHA} 가 main 에 들어와 만든 이미지다. ArgoCD 가 이 커밋을 보고 반영한다."
          # ★다른 저장소가 같은 때 병합되면 이 push 가 거절된다(non-fast-forward).
          #   concurrency 는 ★저장소 안에서만 겹침을 막아 주므로
          #   저장소끼리의 경쟁은 여기서 따로 견딜야 한다.
          #   ★우리는 이미지 줄 한 줄만 고치므로 다시 얹으면 그대로 맞는다.
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/infra -o IdentitiesOnly=yes"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then
              echo "✅ catchap-infra 갱신 — backend → ${SHA}"
              exit 0
            fi
            echo "  push 거절 — 다른 저장소가 먼저 넣은 것으로 보고 다시 얹습니다 ($i/5)"
            git fetch -q origin main || { echo "::error::catchap-infra fetch 실패"; exit 1; }
            git rebase -q origin/main || {
              git rebase --abort 2>/dev/null
              echo "::error::rebase 충돌 — 손으로 봐야 합니다"
              exit 1
            }
            sleep $((i * 3))
          done
          echo "::error::5번 시도했는데 catchap-infra 에 push 가 안 됩니다"
          exit 1

      - name: 뒷정리
        if: always()
        run: shred -u ~/.ssh/infra 2>/dev/null || rm -f ~/.ssh/infra

      - name: 요약
        if: steps.gate.outputs.ready == 'true'
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          {
            echo "### 배포 이미지"
            echo ""
            echo '```'
            echo "${REGISTRY}/${IMAGE_PATH}:${SHA}"
            echo '```'
            echo ""
            echo "매니페스트: \`${MANIFEST_DIR}/\` (catchap-infra · 앱 + 마이그레이션 Job)"
            echo ""
            echo "⚠️ ArgoCD 의 자동 동기화가 꺼져 있으면 화면에서 **Sync** 를 눌러야 반영됩니다."
          } >> "$GITHUB_STEP_SUMMARY"
